---
apiVersion: v1
kind: Namespace
metadata:
  name: mosquitto

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto
data:
  mosquitto.conf: |-
    persistence true
    persistence_location /mosquitto/data
    allow_anonymous false
    connection_messages true
    log_type all
    listener 1883
    password_file /mosquitto/passwd/password_file
    acl_file /mosquitto/acl/acl_file

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-acl
  namespace: mosquitto
data:
  acl_file: |-
    user device_pubsub
    topic write sensors/+/+
    topic write online/+/features/+
    topic read devices/+/values

    user producer_sub
    topic read sensors/+/+

    user online_receiver_sub
    topic read online/+/features/+

    user api_devices_pub
    topic write devices/+/values

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data-claim
  namespace: mosquitto
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883
        runAsUser: 1883
        runAsGroup: 1883
        runAsNonRoot: true
      initContainers:
        - name: prepare-acl
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          command:
            - /bin/sh
            - -ec
            - |
              cp /mosquitto/acl-src/acl_file /mosquitto/acl/acl_file
              chmod 0400 /mosquitto/acl/acl_file
              chown 1883:1883 /mosquitto/acl/acl_file
          volumeMounts:
            - name: acl-src
              mountPath: /mosquitto/acl-src
              readOnly: true
            - name: acl
              mountPath: /mosquitto/acl
      containers:
        - name: mosquitto
          image: ks89/mosquitto:local
          imagePullPolicy: Never  # use the locally loaded image
          env:
            - name: MOSQUITTO_USERS
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: users
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 10
            periodSeconds: 60
          volumeMounts:
            - name: data
              mountPath: /mosquitto/data
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
            - name: passwd
              mountPath: /mosquitto/passwd
            - name: acl
              mountPath: /mosquitto/acl
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data-claim
        - name: mosquitto-config
          configMap:
            name: mosquitto-config
        - name: passwd
          emptyDir: {}
        - name: acl
          emptyDir: {}
        - name: acl-src
          configMap:
            name: mosquitto-acl
            defaultMode: 0444

---
kind: Service
apiVersion: v1
metadata:
  name: mosquitto
  namespace: mosquitto
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      protocol: TCP
      port: 1883
      targetPort: mqtt
